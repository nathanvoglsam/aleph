[package]
name = "aleph-profile"
version = "0.1.0"
description = "This crate provides a very thin abstraction over other profiler crates."
keywords = ["performance", "profiling"]
categories = ["development-tools::profiling"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
documentation.workspace = true
rust-version.workspace = true

[dependencies]
tracy-client = { workspace = true }
aleph-superluminal-sys = { workspace = true, optional = true }
aleph-profile-procmacros = { workspace = true, optional = true }
aleph-pix = { workspace = true, optional = true }

[features]
default = ["procmacros"]
profile-with-superluminal = [
    "aleph-superluminal-sys",
    "aleph-profile-procmacros?/profile-with-superluminal",
]
profile-with-tracy = [
    "tracy-client/enable",
    "aleph-profile-procmacros?/profile-with-tracy",
]
profile-with-pix = [
    "aleph-pix",
    "aleph-profile-procmacros?/profile-with-pix",
]
memory-callsites = []
memory-callstacks = ["memory-callsites"]
message-callsites = []
message-callstacks = ["message-callsites"]
procmacros = ["aleph-profile-procmacros"]
