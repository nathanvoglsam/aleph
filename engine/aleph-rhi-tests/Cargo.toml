[package]
name = "aleph-rhi-tests"
version = "0.1.0"
description = "Tests for aleph-rhi-api and its implementations"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
documentation.workspace = true
rust-version.workspace = true

[badges]
azure-devops = { project = "nathanvoglsam420/Aleph", pipeline = "nathanvoglsam.aleph", build = "1" }

[dependencies]
aleph-rhi-api = { workspace = true }
aleph-rhi-loader = { workspace = true }
aleph-sdl3-link = { workspace = true }
aleph-nstr = { workspace = true }
sdl3 = { workspace = true }

# Each 'binary' is a distinct test case or suite to run. To run the test simply invoke the binary
# using cargo.
#
# The ALEPH_RHI_BACKEND environment variable can be used to select the backend to test (vulkan, d3d12, metal).

[[bin]]
name = "create_device"
path = "bin/create_device.rs"

[[bin]]
name = "swap_chain_acquire_unused_and_present"
path = "bin/swap_chain_acquire_unused_and_present.rs"

[[bin]]
name = "swap_chain_acquire_unused_no_present"
path = "bin/swap_chain_acquire_unused_no_present.rs"

[[bin]]
name = "swap_chain_acquire_used_and_present"
path = "bin/swap_chain_acquire_used_and_present.rs"

[[bin]]
name = "swap_chain_acquire_used_no_present"
path = "bin/swap_chain_acquire_used_no_present.rs"
